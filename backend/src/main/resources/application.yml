spring:
  application:
    name: soul-x-time-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/soulxtime}
    username: ${DATABASE_USERNAME:soulxtime_user}
    password: ${DATABASE_PASSWORD:local_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ============================================================
# JWT Configuration
# ============================================================
app:
  jwt:
    secret: ${JWT_SECRET:dev_secret_change_in_production_must_be_at_least_256_bits_long}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}       # 15 minutes
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}
    cookie-secure: ${JWT_COOKIE_SECURE:false}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  whatsapp:
    mode: ${WHATSAPP_MODE:LINK}
    owner-number: ${WHATSAPP_OWNER_NUMBER:9787307883}
    api-url: ${WHATSAPP_API_URL:}
    api-token: ${WHATSAPP_API_TOKEN:}

  billing:
    number-prefix: ${BILL_NUMBER_PREFIX:ST}

  admin:
    owner-name: ${ADMIN_OWNER_NAME:Soul x Time}
    owner-phone: ${ADMIN_OWNER_PHONE:}

  media:
    base-url: ${MEDIA_BASE_URL:http://localhost:8080/media}

# ============================================================
# Actuator / Health
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.soulxtime: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
