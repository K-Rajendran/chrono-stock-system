spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: false

  flyway:
    enabled: false  # Use JPA DDL for tests

app:
  jwt:
    secret: test_secret_for_unit_tests_must_be_at_least_256_bits_long_padded
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    cookie-domain: localhost
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:3000
  whatsapp:
    mode: LINK
    owner-number: ''
    api-url: ''
    api-token: ''
  billing:
    number-prefix: ST
  admin:
    owner-name: Test Admin
    owner-phone: ''
  media:
    base-url: http://localhost:8080/media

logging:
  level:
    root: WARN
    com.soulxtime: WARN
